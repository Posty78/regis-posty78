<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Widget Regis - Posty78</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Teko:wght@500;600&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:transparent;}
  body{font-family:"Rajdhani",sans-serif;overflow:hidden;}

  .hud-peplink{
    display:inline-flex; flex-direction:column; align-items:stretch; gap:10px;
    background:transparent; border:1px solid rgba(255,255,255,0.75);
    border-radius:10px; padding:16px 26px;
    opacity:0; transition:opacity .35s ease;
  }
  .hud-peplink.is-visible{ opacity:1; }
  .hud-peplink__title{
    display:inline-block; align-self:center;
    font-family:"Rajdhani",sans-serif; font-weight:700; font-size:15px; letter-spacing:0.2em; color:#fff; text-align:center;
    text-shadow:0 1px 4px rgba(0,0,0,0.9), 0 0 8px rgba(0,0,0,0.6);
    border:1px solid rgba(255,255,255,0.75); border-radius:6px; padding:4px 12px;
  }
  .hud-peplink__lines{ display:flex; flex-direction:column; gap:10px; margin-top:2px; }
  .hud-peplink__line{ display:flex; align-items:center; gap:12px; }
  .hud-peplink__icon{ width:22px; height:22px; flex-shrink:0; filter:drop-shadow(0 0 4px currentColor) drop-shadow(0 1px 3px rgba(0,0,0,0.9)); transition:color .3s ease; }
  .hud-peplink__icon svg{ width:100%; height:100%; display:block; }
  .hud-peplink__icon--green{ color:#2ecc40; }
  .hud-peplink__icon--orange{ color:#ffab00; }
  .hud-peplink__icon--red{ color:#e0263f; }
  .hud-peplink__info{ display:flex; flex-direction:column; line-height:1.15; min-width:0; }
  .hud-peplink__carrier{ font-family:"Teko",sans-serif; font-weight:600; font-size:19px; color:#fff; text-transform:uppercase; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:220px; text-shadow:0 1px 4px rgba(0,0,0,0.9), 0 0 8px rgba(0,0,0,0.6); }
  .hud-peplink__mbps{ font-family:"Rajdhani",sans-serif; font-weight:600; font-size:13px; color:rgba(255,255,255,0.85); white-space:nowrap; text-shadow:0 1px 4px rgba(0,0,0,0.9), 0 0 8px rgba(0,0,0,0.6); }
</style>
</head>
<body>

<div class="hud-peplink" id="widget">
  <div class="hud-peplink__title">REGIS</div>
  <div class="hud-peplink__lines" id="lines"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDRwbfhM7zzQWH9md8DzwbtRsEe1G4Lh30",
  authDomain: "posty78-overlay.firebaseapp.com",
  projectId: "posty78-overlay",
  storageBucket: "posty78-overlay.firebasestorage.app",
  messagingSenderId: "815738211609",
  appId: "1:815738211609:web:833120a585f5d9e5a5c988",
};

const app = initializeApp(FIREBASE_CONFIG);
const db = getFirestore(app);

// Widget de supervision reseau, integre comme n'importe quel "Widget externe
// (URL)" de l'overlay (meme mecanisme que Roue/Vote/Sondage/etc.) - invisible
// par defaut, ne s'affiche que sur declenchement reel (!regis / bouton
// regis.posty78.fr), pendant EXACTEMENT 15s, ou en boucle demo via ?demo=1
// (bascule "Demo: ON/OFF" standard des widgets externes de l'editeur).
const VISIBLE_DURATION_MS = 30000;
// Le scan reel met du temps a remonter un vrai debit (interrogation du
// Peplink) - on retarde l'apparition du widget pour ne montrer que des
// donnees deja a jour, plutot qu'un affichage instantane qui se remplit
// progressivement sous les yeux du public.
const REVEAL_DELAY_MS = 10000;
const DEMO_STEP_MS = 3600;
const DEMO_SCENARIOS = [
  { lines: [] },
  { lines: [
    { carrier: "Bouygues", mbps: null, color: "red" },
    { carrier: "Orange", mbps: null, color: "red" },
    { carrier: "SFR", mbps: null, color: "red" },
    { carrier: "Free", mbps: null, color: "red" },
  ]},
  { lines: [
    { carrier: "Bouygues", mbps: 0.8, color: "orange" },
    { carrier: "Orange", mbps: 0.4, color: "orange" },
    { carrier: "SFR", mbps: null, color: "red" },
    { carrier: "Free", mbps: null, color: "red" },
  ]},
  { lines: [
    { carrier: "Bouygues", mbps: 6.2, color: "green" },
    { carrier: "Orange", mbps: 4.8, color: "green" },
    { carrier: "SFR", mbps: 0.7, color: "orange" },
    { carrier: "Free", mbps: 3.5, color: "green" },
  ]},
  { lines: [
    { carrier: "Bouygues", mbps: 6.2, color: "green" },
    { carrier: "Orange", mbps: 4.8, color: "green" },
    { carrier: "SFR", mbps: 9.1, color: "green" },
    { carrier: "Free", mbps: 3.5, color: "green" },
    { carrier: "Données mobile (Free)", mbps: 0.6, color: "orange" },
  ]},
  { lines: [
    { carrier: "Bouygues", mbps: 6.2, color: "green" },
    { carrier: "Orange", mbps: 4.8, color: "green" },
    { carrier: "SFR", mbps: 9.1, color: "green" },
    { carrier: "Free", mbps: 3.5, color: "green" },
    { carrier: "Données mobile (Free)", mbps: 8.9, color: "green" },
    { carrier: "Starlink", mbps: 92.3, color: "green" },
  ]},
  { lines: [{ carrier: "Erreur: login Peplink injoignable", mbps: null, color: "red" }] },
];

// Icones (traits generiques, pas les vrais logos operateurs - question de
// droits sur les marques) : tour-relais pour les lignes filaires/Peplink et
// le wifi generique, carte SIM pour les donnees mobile, parabole pour Starlink.
const ICON_TOWER = `<svg viewBox="0 0 24 24" fill="currentColor"><rect x="2" y="14" width="4" height="8" rx="1"/><rect x="10" y="8" width="4" height="14" rx="1"/><rect x="18" y="3" width="4" height="19" rx="1"/></svg>`;
const ICON_WIFI = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M2 8.5a16 16 0 0 1 20 0"/><path d="M5.5 12.7a11 11 0 0 1 13 0"/><path d="M9 17a6 6 0 0 1 6 0"/><circle cx="12" cy="20.5" r="1.3" fill="currentColor" stroke="none"/></svg>`;
const ICON_SIM = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M7 3h6l6 6v10a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M9 12h2M13 12h2M9 16h6"/></svg>`;
const ICON_SATELLITE = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11a12 12 0 0 1 12 12"/><path d="M3 5a18 18 0 0 1 18 18"/><circle cx="3" cy="17" r="2" fill="currentColor" stroke="none"/><path d="M14 6l6-2-2 6-4 2-2-4z"/></svg>`;

const WAN_TEMPLATE = [
  { key: "Bouygues", label: "Bouygues", icon: ICON_TOWER },
  { key: "Orange", label: "Orange", icon: ICON_TOWER },
  { key: "SFR", label: "SFR", icon: ICON_TOWER },
  { key: "Free", label: "Free", icon: ICON_TOWER },
];
const WIFI_FALLBACK = { key: "wifi", label: "Wifi", icon: ICON_WIFI };
const EXTRA_TEMPLATE = [
  { label: "Données mobile", icon: ICON_SIM, match: (c) => (c || "").startsWith("Données mobile") },
  { label: "Starlink", icon: ICON_SATELLITE, match: (c) => c === "Starlink" },
];

const el = document.getElementById("widget");
const linesEl = document.getElementById("lines");

let lastTriggeredAt = null;
let lastDemoTriggeredAt = null;
let hideTimer = null;
let revealTimer = null;
let demoInterval = null;
let isDemoActive = false;

function isRealCarrier(carrier) {
  return !!carrier && !carrier.startsWith("Erreur:");
}

// state/peplink_result est ecrit par n'importe quel compte Firebase anonyme
// (auto-service) - "color" est insere dans un attribut class ci-dessous, donc
// on le valide contre une enumeration fermee plutot que de l'utiliser tel
// quel (sinon injection HTML possible via ce champ).
function safeColor(c) {
  return ["green", "orange", "red"].includes(c) ? c : "red";
}

function rowHtml(label, icon, data) {
  const usable = data && isRealCarrier(data.carrier);
  const color = safeColor(usable ? data.color : "red");
  const mbps = usable && typeof data.mbps === "number" ? data.mbps : null;
  return `
    <div class="hud-peplink__line">
      <span class="hud-peplink__icon hud-peplink__icon--${color}">${icon}</span>
      <span class="hud-peplink__info">
        <span class="hud-peplink__carrier">${label}</span>
        <span class="hud-peplink__mbps">${mbps != null ? mbps.toFixed(1) + " Mbps" : "-- Mbps"}</span>
      </span>
    </div>
  `;
}

// Gabarit toujours affiche en entier (rouge par defaut tant qu'aucune donnee
// ne correspond) - jamais de texte "en attente"/"erreur", jamais de ligne
// masquee. Seul le bloc du haut change : les 4 WAN Peplink si detectes, sinon
// une seule ligne "Wifi" generique (voir WIFI_FALLBACK).
function render(lines) {
  lines = lines || [];
  const hasWan = WAN_TEMPLATE.some((t) => lines.some((l) => l.carrier === t.key));
  const topTemplate = hasWan ? WAN_TEMPLATE : [WIFI_FALLBACK];

  const rows = topTemplate.map((t) => {
    const data = t.key === "wifi"
      ? lines.find((l) =>
          isRealCarrier(l.carrier) &&
          !WAN_TEMPLATE.some((w) => w.key === l.carrier) &&
          !EXTRA_TEMPLATE.some((e) => e.match(l.carrier))
        )
      : lines.find((l) => l.carrier === t.key);
    return rowHtml(t.label, t.icon, data);
  });

  for (const t of EXTRA_TEMPLATE) {
    const data = lines.find((l) => t.match(l.carrier));
    rows.push(rowHtml(t.label, t.icon, data));
  }

  linesEl.innerHTML = rows.join("");
}

function show() {
  isDemoActive = false;
  clearInterval(demoInterval);
  clearTimeout(hideTimer);
  clearTimeout(revealTimer);
  el.classList.remove("is-visible");
  render([]); // gabarit tout rouge des maintenant (invisible), mis a jour en direct par les vrais resultats qui arrivent en arriere-plan

  revealTimer = setTimeout(() => {
    el.classList.add("is-visible");
    hideTimer = setTimeout(() => el.classList.remove("is-visible"), VISIBLE_DURATION_MS);
  }, REVEAL_DELAY_MS);
}

function playDemoOnce(onDone) {
  isDemoActive = true;
  clearTimeout(hideTimer);
  clearTimeout(revealTimer);
  clearInterval(demoInterval);
  el.classList.add("is-visible");

  let step = 0;
  render(DEMO_SCENARIOS[step].lines);
  demoInterval = setInterval(() => {
    step++;
    if (step >= DEMO_SCENARIOS.length) {
      clearInterval(demoInterval);
      if (onDone) onDone();
      return;
    }
    render(DEMO_SCENARIOS[step].lines);
  }, DEMO_STEP_MS);
}

// ?demo=1 (bascule "Demo: ON/OFF" de l'editeur, widget externe) : boucle en
// continu tant que le parametre est present, pour laisser le temps de
// positionner le widget dans l'editeur.
if (new URLSearchParams(location.search).get("demo") === "1") {
  const loop = () => playDemoOnce(loop);
  loop();
} else {
  let initialized = false;

  onSnapshot(
    doc(db, "state", "peplink"),
    (snap) => {
      const data = snap.data();
      const demoTriggeredAt = data?.demoTriggeredAt?.toMillis?.() ?? null;
      const triggeredAt = data?.triggeredAt?.toMillis?.() ?? null;

      // Au tout premier chargement de la page (ouverture de l'onglet/iframe),
      // on ne fait que memoriser les declenchements deja presents dans
      // Firestore (souvent d'anciens tests) sans reagir dessus - seuls les
      // VRAIS nouveaux declenchements, arrivant apres ce point, affichent le
      // widget.
      if (!initialized) {
        initialized = true;
        lastDemoTriggeredAt = demoTriggeredAt;
        lastTriggeredAt = triggeredAt;
        return;
      }

      if (demoTriggeredAt && demoTriggeredAt !== lastDemoTriggeredAt) {
        lastDemoTriggeredAt = demoTriggeredAt;
        playDemoOnce(() => {
          el.classList.remove("is-visible");
          isDemoActive = false;
        });
        return;
      }

      if (!triggeredAt || triggeredAt === lastTriggeredAt) return;
      lastTriggeredAt = triggeredAt;
      show();
    },
    (err) => console.warn("[regis-widget] lecture declenchement impossible :", err.message)
  );

  onSnapshot(
    doc(db, "state", "peplink_result"),
    (snap) => {
      if (isDemoActive) return;
      const data = snap.data();
      if (!data) return;
      const updatedAt = data.updatedAt?.toMillis?.() ?? 0;
      if (lastTriggeredAt && updatedAt < lastTriggeredAt) return;
      render(data.lines);
    },
    (err) => console.warn("[regis-widget] lecture resultat impossible :", err.message)
  );
}
</script>

</body>
</html>
